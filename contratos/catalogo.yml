fuente: catalogo
version: 1
ultima_actualizacion: "2026-11-18"
responsable: "area_comercial_productos"
llegada: "Archivos JSON, cada uno es un arreglo con el catálogo completo, en /Volumes/<catalogo>/default/vol_landing/catalogo/"
metodo_ingesta: "COPY INTO en una tarea del job, con multiLine y primitivesAsString: llegan pocos archivos (snapshots completos), sin necesidad de streaming, y COPY INTO es idempotente por archivo"
frecuencia_esperada: "Un snapshot completo cada pocos meses (en el caso: 1 de marzo y 1 de agosto de 2026)"
tipo_entrega: "Catálogo completo en cada archivo (snapshot), no solo cambios"
tabla_bronze: "<catalogo>.bronze.catalogo"
tabla_silver: "<catalogo>.silver.catalogo (último estado de cada producto) y <catalogo>.silver.catalogo_snapshots (un registro por producto y snapshot)"
llave: "producto_id (y producto_id con snapshot_fecha en catalogo_snapshots)"
historizacion: "Se conservan todos los snapshots en catalogo_snapshots, así queda el precio anterior. silver.catalogo toma la versión del último snapshot en que aparece cada producto, que es la categoría que pide la pregunta 5. Los descontinuados (activo false) se conservan marcados: sus ventas y reseñas históricas siguen siendo válidas"

columnas:
  - nombre: producto_id
    tipo: "string"
    nulo: false
  - nombre: snapshot_fecha
    tipo: "date"
    nulo: false
    regla: "Se toma del nombre del archivo (catalogo_productos_AAAA-MM-DD.json)"
  - nombre: nombre_producto
    tipo: "string"
    nulo: false
  - nombre: categoria
    tipo: "string"
    nulo: false
    valores_permitidos: ["Línea blanca", "Cocina", "Electrónica", "Climatización", "Entretenimiento"]
  - nombre: marca
    tipo: "string"
    nulo: true
  - nombre: precio_lista
    tipo: "decimal(12,2)"
    nulo: true
    regla: "Mayor a 0; si no es un número positivo queda nulo y el texto original se guarda en precio_lista_origen"
  - nombre: precio_lista_origen
    tipo: "string"
    nulo: true
  - nombre: activo
    tipo: "boolean"
    nulo: false

reglas_de_calidad:
  - nombre: precio_valido
    condicion: "precio_lista IS NOT NULL"
    politica: "warn"
    destino_rechazos: "Métricas del event log del pipeline; el valor original queda en precio_lista_origen"
    justificacion: "El precio de lista no interviene en ninguna pregunta de negocio. Descartar el producto dejaría huérfanas sus ventas y reseñas, así que se conserva con el precio en nulo y se mide"
  - nombre: producto_id_presente
    condicion: "producto_id IS NOT NULL"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Sin llave el producto no se puede relacionar con nada"
  - nombre: categoria_conocida
    condicion: "categoria IS NOT NULL"
    politica: "warn"
    destino_rechazos: "Métricas del event log del pipeline"
    justificacion: "Una variante nueva de categoría no debe borrar el producto; se mide y se agrega al mapeo"
  - nombre: marca_presente
    condicion: "marca IS NOT NULL"
    politica: "warn"
    destino_rechazos: "Métricas del event log del pipeline"
    justificacion: "La marca es descriptiva y no interviene en las preguntas"

transformaciones_silver:
  - "categoria: minúsculas, sin tildes y con guion bajo como espacio; se mapea a 5 categorías con su nombre en castellano"
  - "precio_lista: se quita S/ y la coma de miles (S/ 1,299.90 a 1299.90), try_cast a decimal(12,2); negativo, cero o nulo queda en nulo"
  - "activo: texto true o false a boolean"
  - "Duplicados dentro de un snapshot: se conserva el registro con precio válido y, entre dos válidos, el de mayor precio, para que la regla sea determinista"
  - "silver.catalogo: un registro por producto, el de su último snapshot, con primer_snapshot y ultimo_snapshot"

problemas_conocidos:
  - problema: "precio_lista como texto con moneda"
    ejemplo: "S/ 1,474.75"
    filas_afectadas: "90 (49 en marzo y 41 en agosto)"
    tratamiento: "Normalización a decimal"
  - problema: "precio_lista negativo, cero o nulo"
    ejemplo: "PRD-01099 con -4867.67"
    filas_afectadas: "94 (31 negativos o cero y 12 nulos en marzo; 27 y 24 en agosto)"
    tratamiento: "precio_lista en nulo y advertencia precio_valido"
  - problema: "marca nula"
    ejemplo: "PRD-02091"
    filas_afectadas: "94 (46 en marzo y 48 en agosto)"
    tratamiento: "Se conserva nula, con advertencia marca_presente"
  - problema: "categoria con 17 variantes para 5 categorías"
    ejemplo: "Climatizacion, Climatización, CLIMATIZACION; Línea blanca, linea_blanca, LINEA BLANCA"
    filas_afectadas: "Todas las filas usan alguna variante"
    tratamiento: "Mapeo a conjunto cerrado"
  - problema: "Productos repetidos con precios distintos en el snapshot de marzo"
    ejemplo: "PRD-00295 con 451.86 y 430.34"
    filas_afectadas: "25 productos (2.305 filas para 2.280 productos)"
    tratamiento: "Deduplicación por producto y snapshot"
  - problema: "Snapshot de agosto con productos nuevos y descontinuados"
    ejemplo: "PRD-01372 con activo false"
    filas_afectadas: "120 productos nuevos y 60 descontinuados"
    tratamiento: "Se conservan todos; los descontinuados quedan marcados con activo false"
