fuente: tracking_envios
version: 1
ultima_actualizacion: "2026-11-18"
responsable: "operaciones_ecommerce (dato del courier, recibido a través de ElectroCasa)"
llegada: "Azure SQL Database, tabla dbo.TrackingEnvios"
metodo_ingesta: "Conector query-based de SQL Server (Lakeflow Connect), declarado en resources/electrocasa_tracking.yml"
connection_unity_catalog: "electrocasa_tracking_sqlserver"
cursor: fecha_modificacion
modo_historia: "SCD Type 1: cada evento tiene su propio evento_id y la tabla de origen no modifica eventos ya escritos, así que no hay versiones que conservar; con evento_id como llave, una segunda corrida sin cambios no agrega filas y un evento corregido en el origen se actualiza en lugar de duplicarse"
frecuencia_esperada: "En cada corrida del job; la tabla ya está completa desde el inicio del proyecto (15.139 eventos de marzo a octubre)"
tabla_bronze: "<catalogo>.bronze.tracking_envios"
tabla_silver: "<catalogo>.silver.tracking_envios"
llave: evento_id
depende_de:
  - fuente: ventas
    columna: venta_id

columnas:
  - nombre: evento_id
    tipo: "bigint"
    nulo: false
  - nombre: tracking_id
    tipo: "string"
    nulo: false
  - nombre: venta_id
    tipo: "string"
    nulo: true
    regla: "Si no existe en silver.ventas, el evento se conserva con venta_existente = false (advertencia): el envío ocurrió y cuenta en la pregunta 6"
  - nombre: courier
    tipo: "string"
    nulo: false
  - nombre: estado_entrega
    tipo: "string"
    nulo: false
    valores_permitidos: ["pendiente", "en_transito", "entregado", "devuelto"]
  - nombre: sucursal_origen
    tipo: "string"
    nulo: true
  - nombre: fecha_actualizacion
    tipo: "date"
    nulo: true
  - nombre: fecha_modificacion
    tipo: "timestamp"
    nulo: false
  - nombre: venta_existente
    tipo: "boolean"
    nulo: false

reglas_de_calidad:
  - nombre: estado_conocido
    condicion: "estado_entrega IS NOT NULL"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Un estado desconocido no se puede ubicar en el ciclo pendiente, en tránsito, entregado o devuelto de la pregunta 6; en cuarentena se ve la variante y se agrega al mapeo"
  - nombre: tracking_presente
    condicion: "tracking_id IS NOT NULL"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Sin envío no hay a quién atribuir el evento"
  - nombre: evento_id_presente
    condicion: "evento_id IS NOT NULL"
    politica: "drop"
    destino_rechazos: "<catalogo>.silver.cuarentena"
    justificacion: "Es la llave del conector"
  - nombre: venta_existente
    condicion: "venta_existente"
    politica: "warn"
    destino_rechazos: "Métricas del event log del pipeline"
    justificacion: "El envío se hizo aunque la venta no esté en Silver"
  - nombre: fecha_actualizacion_presente
    condicion: "fecha_actualizacion IS NOT NULL"
    politica: "warn"
    destino_rechazos: "Métricas del event log del pipeline"
    justificacion: "Los tiempos de la pregunta 6 se miden con fecha_modificacion, que nunca es nula"

transformaciones_silver:
  - "estado_entrega: minúsculas, sin tildes y con guion bajo como espacio; En camino, EN_CAMINO, En transito y en_transito a en_transito"
  - "courier: minúsculas y sin tildes, y se mapea a un conjunto cerrado (Olva y Olva Courier a Olva Courier); un courier fuera del mapeo queda con initcap"
  - "Mensajes reprocesados: dentro de cada tracking_id, un mismo estado registrado más de una vez se queda con el primero (menor fecha_modificacion y, si empatan, menor evento_id). La pregunta 6 usa el primer pendiente, el primer entregado y la existencia de un devuelto, así que la deduplicación no altera ninguna de las tres medidas"

problemas_conocidos:
  - problema: "courier escrito de 10 formas para 3 couriers, con Olva también como Olva Courier"
    ejemplo: "SERVIENTREGA, servientrega, Servientrega; shalom, SHALOM, Shalom; Olva, OLVA COURIER, Olva Courier, olva courier"
    filas_afectadas: "Todos los eventos (15.139); 5.044 dicen Olva u Olva Courier"
    tratamiento: "Mapeo a Olva Courier, Servientrega y Shalom"
  - problema: "estado_entrega escrito de 13 formas para 4 estados"
    ejemplo: "PENDIENTE, pendiente, Pendiente; En transito, EN_CAMINO, en_transito, En camino; ENTREGADO; devuelto, DEVUELTO"
    filas_afectadas: "Todos los eventos; ninguno quedó fuera del conjunto cerrado (0 rechazados)"
    tratamiento: "Mapeo a pendiente, en_transito, entregado y devuelto, y regla estado_conocido"
  - problema: "Mensajes reprocesados con distinto evento_id"
    ejemplo: "Un mismo tracking_id con el mismo estado registrado dos veces"
    filas_afectadas: "90 (15.139 eventos en Bronze y 15.049 en Silver, sin rechazados)"
    tratamiento: "Deduplicación por tracking_id y estado"
  - problema: "fecha_actualizacion nula"
    ejemplo: "285 eventos de Bronze sin fecha de negocio"
    filas_afectadas: "285"
    tratamiento: "Advertencia; los tiempos usan fecha_modificacion"
  - problema: "venta_id que no existe en ventas"
    ejemplo: "415 eventos de Silver con venta_existente = false"
    filas_afectadas: "415"
    tratamiento: "Advertencia venta_existente; el envío cuenta en la pregunta 6"
